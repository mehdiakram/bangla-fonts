<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: stylized Bengali letter অ -->
  <rect x="2" y="8" width="44" height="44" rx="10" fill="url(#logoGrad)"/>
  <text x="24" y="40" font-family="serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">অ</text>
  <!-- Site name -->
  <text x="56" y="28" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#1e293b" font-weight="700">বাংলা ফন্ট</text>
  <text x="56" y="46" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#64748b" font-weight="500">লাইব্রেরি</text>
</svg>
